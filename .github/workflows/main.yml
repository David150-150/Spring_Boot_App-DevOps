name: java spring boot CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '6.11.0'

      # Step 4: Install legacy build tools
      - name: Pre-install global tools
        run: |
          npm install -g rimraf@2 webpack@2.5.0
          echo "$(npm bin -g)" >> $GITHUB_PATH

      # Step 5: Make Maven Wrapper executable
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      # Step 6: Run verification build
      - name: Build with Maven
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"
        run: ./mvnw -B clean verify

      # Step 7: Switch to Java 11 for SonarQube Cloud
      - name: Set up JDK 11 for SonarQube
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Step 8: Analyze code with SonarQube Cloud
      - name: SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.4.0.6343:sonar \
            -Dsonar.projectKey=David150-150_Spring_Boot_App-DevOps \
            -Dsonar.organization=david150-150 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN

      # Step 9: Package production WAR
      - name: Package Production WAR
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"
        run: ./mvnw -B package -Pprod -DskipTests

      # Step 10: Upload WAR
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: great-big-example-app-prod
          path: target/*.war